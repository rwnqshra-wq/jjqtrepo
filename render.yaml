services:
  - type: web
    name: jusour-server
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: DASHBOARD_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
